name: update from upstream

# Weekly: if Probe-ability has tagged a release this port does not carry yet, regenerate the model and the
# golden vectors from it and open a pull request. CI then runs the golden tests on the PR - green means the
# new trees just work, red means upstream changed its feature code and ProbeAbilityModel.cs must follow.

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Probe-ability tag to port (default: the latest)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate from upstream
        id: regen
        run: |
          python tools/update.py ${{ inputs.ref && format('--ref {0}', inputs.ref) || '' }} | tee update.log
          echo "source=$(head -1 update.log | sed 's/^Regenerated from //; s/:$//')" >> "$GITHUB_OUTPUT"
          rm update.log
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-update
          delete-branch: true
          commit-message: "Port ${{ steps.regen.outputs.source }}"
          title: "Port ${{ steps.regen.outputs.source }}"
          body: |
            Regenerated by `tools/update.py` from ${{ steps.regen.outputs.source }}.

            The golden tests run on this PR. Green means the new model just works. Red means upstream
            changed its feature code, and `src/ProbeAbility/ProbeAbilityModel.cs` needs to follow it.
